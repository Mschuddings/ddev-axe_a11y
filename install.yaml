# Reference: https://ddev.readthedocs.io/en/stable/users/extend/additional-services/

name: axe_a11y

ddev_version_constraint: '>= v1.24.3'

# Files copied into the project's .ddev directory. Each contains #ddev-generated
# so that a later `ddev add-on get` can replace it, and so that removal can tell
# an unmodified file from one the user edited.
project_files:
  - docker-compose.axe_a11y.yaml
  - config.axe_a11y.yaml
  - axe_a11y-refresh-image.sh
  - commands/host/axe_a11y

# Executed in the project's .ddev directory.
post_install_actions:
  - chmod +x axe_a11y-refresh-image.sh
  # Both directories are bind-mount sources. Docker creates a missing bind-mount
  # source as root, which the container, running as the host user, then cannot
  # write to. Creating them here means they are owned by the right user.
  - mkdir -p axe_a11y/config
  - mkdir -p ${DDEV_APPROOT}/reports/axe_a11y/results

# Executed in the project's .ddev directory. Files listed in project_files are
# removed automatically when they still contain #ddev-generated.
removal_actions:
  # Only removes the directories when they are empty: URL lists, baselines and
  # previous reports are the user's, not the add-on's.
  - rmdir axe_a11y/config axe_a11y 2>/dev/null || true
  - rmdir ${DDEV_APPROOT}/reports/axe_a11y/results ${DDEV_APPROOT}/reports/axe_a11y 2>/dev/null || true
